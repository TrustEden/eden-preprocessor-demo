name: ai_dungeon_master_mvp
description: AI-powered Dungeon Master for solo D&D 5e adventures
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.3
  http: ^1.1.0
  provider: ^6.1.0
  uuid: ^4.0.0
  shared_preferences: ^2.2.0
  # Secure storage for API keys
  flutter_secure_storage: ^9.0.0
  # Multiplayer and networking
  web_socket_channel: ^2.4.0
  # Voice narration
  flutter_tts: ^3.8.3
  # File picker for import/export
  file_picker: ^6.1.1
  # Archive for compression
  archive: ^3.4.10
  # JSON encoding/decoding (already in dart:convert, but explicit for clarity)
  # Image caching for portraits
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
